[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemodeck"
version = "0.1.0"
description = "Operator console for NVIDIA NemoClaw sandboxes — approvals inbox, policy promotion, lifecycle, audit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Arees Manesia" }]
keywords = ["nemoclaw", "openshell", "ai-agents", "sandbox", "security", "operator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
nemodeck = "nemodeck.__main__:main"

[tool.setuptools.packages.find]
include = ["nemodeck*"]

[tool.setuptools.package-data]
nemodeck = ["web/*.html", "web/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"